services:
  # ---------------------------------------------------------------
  # Free Games Claimer Remaster
  # ---------------------------------------------------------------
  app:
    # Pin CLAIMER_TAG to a Release for reproducible installs; source users may use latest.
    image: ghcr.io/rafaelcairess/free-games-claimer-remaster-gui:${CLAIMER_TAG:-latest}
    container_name: fgc-remaster
    build: .
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "${NOVNC_PORT:-7080}:7080"
      - "127.0.0.1:${GUI_PORT:-8080}:8080"
    volumes:
      - fgc_data:/fgc/data
    env_file:
      - .env
    healthcheck:
      test: pgrep python3 && curl --fail http://localhost:7080 || exit 1
      interval: 10s
      timeout: 5s

volumes:
  fgc_data:
