name: claimer-control

services:
  app:
    image: ghcr.io/rafaelcairess/lontrium:${CLAIMER_TAG:-latest}
    container_name: claimer-control
    restart: unless-stopped
    mem_limit: ${CLAIMER_MEMORY_LIMIT:-2g}
    pids_limit: ${CLAIMER_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tty: true
    stdin_open: true
    ports:
      - "${NOVNC_PORT:-7080}:7080"
      - "127.0.0.1:${GUI_PORT:-8080}:8080"
    volumes:
      - claimer_data:/fgc/data
    environment:
      GUI_ENABLED: "true"
      GUI_SETUP_REQUIRED: "true"
      GUI_PORT: "8080"
      RUN_ON_STARTUP: "true"
      NOTIFY_UPDATES: "true"
      CLEAN_BROWSER_CACHE_ON_STARTUP: "true"
    healthcheck:
      test: ["CMD-SHELL", "pgrep python3 && curl --fail http://localhost:8080/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  claimer_data:
    name: ${CLAIMER_DATA_VOLUME:-claimer-control-data}
